[package]
name = "relay"
version = "4.0.0-alpha.1"
edition = "2024"
authors = ["Broxus team"]
publish = false
license-file = "LICENSE"

[package.metadata.deb]
maintainer = "Broxus <hello@broxus.com>"
copyright = "2026, Broxus <hello@broxus.com>"
license-file = ["LICENSE", "4"]
extended-description = """\
Octus Bridge relay node that validates transfers across \
multiple blockchains. Supports all EVM based networks."""
depends = "$auto"
section = "utility"
priority = "optional"
features = ["venom"]
assets = [
    [
        "target/release/relay",
        "usr/bin/",
        "755",
    ],
    [
        "contrib/config.yaml",
        "etc/relay/",
        "644",
    ],
    [
        "README.md",
        "usr/share/doc/relay/README",
        "644",
    ],
]
maintainer-scripts = "contrib/"
systemd-units = { enable = true }

[features]
legacy-bridge-contract = []
legacy-contracts = []
disable-staking = []
venom = ["ton_block/venom"]
ton = ["ton_block/ton", "disable-staking"]

[dependencies]
anyhow = "1"
argh = "0.1"
async-trait = "0.1"
base64 = "0.22"
borsh = "0.10.4"
broxus-util = { version = "0.2", default-features = false, features = ["serde", "config", "alloc", "public-ip"] }
chacha20poly1305 = "0.10"
chrono = "0.4"
dashmap = "6"
dialoguer = "0.12"
either = "1"
futures-util = "0.3"
hex = "0.4"
num-traits = "0.2"
once_cell = "1"
parking_lot = { version = "0.12", features = ["hardware-lock-elision"] }
pomfrit = "0.1"
rand = "0.10"
reqwest = "0.13"
rustc-hash = "2"
secp256k1 = { version = "0.27", features = ["recovery"] }
secstr = { version = "0.5", features = ["serde", "pre"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "fs", "rt-multi-thread", "macros", "signal", "parking_lot"] }
tracing = "0.1"
tracing-stackdriver = "0.10"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tryhard = "0.5"
tvm-rpc-client = { package = "everscale-rpc-client", git = "https://github.com/broxus/everscale-jrpc.git", version = "0.6.1" }
url = { version = "2", features = ["serde"] }

ed25519-dalek = { git = "https://github.com/broxus/ed25519-dalek.git" }
tiny-bip39 = { git = "https://github.com/broxus/tiny-bip39.git" }
tiny-hderive = { git = "https://github.com/broxus/tiny-hderive.git" }

# EVM
ethabi = "18"
web3 = { version = "0.19", default-features = false, features = ["http-rustls-tls", "signing"] }

# Solana dependencies
solana-client = { git = 'https://github.com/broxus/solana', branch = 'broxus' }
solana-sdk = { git = 'https://github.com/broxus/solana', branch = 'broxus' }
solana-transaction-status = { git = 'https://github.com/broxus/solana', branch = 'broxus' }

# TVM specific dependencies
ton_abi = { git = "https://github.com/broxus/ton-labs-abi" }
ton_block = { git = "https://github.com/broxus/ton-labs-block" }
ton_executor = { git = "https://github.com/broxus/ton-labs-executor" }
ton_types = { git = "https://github.com/broxus/ton-labs-types" }

evm-tvm-abi-converter = { package = "eth-ton-abi-converter", git = "https://github.com/broxus/eth-ton-abi-converter.git", branch = "update-ton-abi" }

# Solana Bridge
solana-bridge = { git = "https://github.com/broxus/octusbridge-solana-contracts.git" }

# Nekoton SDK
nekoton-abi = { git = "https://github.com/broxus/nekoton.git", features = ["derive"] }
nekoton-utils = { git = "https://github.com/broxus/nekoton.git", features = ["encryption"] }

[dev-dependencies]
cargo-husky = { version = "1", features = ["default", "run-cargo-fmt", "run-cargo-check"] }
tempfile = "3"

[patch.crates-io]
hmac-drbg = { git = "https://github.com/Rexagon/rust-hmac-drbg" }
solana-program = { git = 'https://github.com/broxus/solana', branch = 'broxus' }
solana-zk-token-sdk = { git = 'https://github.com/broxus/solana', branch = 'broxus' }
